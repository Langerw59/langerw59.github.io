<!DOCTYPE html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>das Language Lab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/core/assets/style.css" />
    <!-- 2026-11-25: Seite baut sich aus /core/js/etagen_daten.js (3. Etage) –
         dieselben Bereiche wie im Menü. RU: страница строится из общего списка. -->
    <script src="/core/js/etagen_daten.js"></script>
    <script src="/core/js/core_init.js" defer></script>
    <style>
      .ll-kopf h1 { margin: 0 0 4px; }
      .ll-kopf p { margin: 0 0 18px; color: #5b6475; }
      .ll-bereiche { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
      .ll-bereich { background: #fff; border: 1px solid #d9dee7; border-top: 5px solid #2f6fb3; border-radius: 14px; padding: 14px 16px 16px; }
      .ll-bereich h2 { margin: 0 0 2px; font-size: 20px; }
      .ll-bereich .ll-info { margin: 0 0 10px; font-size: 14px; color: #5b6475; }
      .ll-bereich a { display: block; padding: 10px 12px; margin-top: 6px; border: 1px solid #e3e7ee; border-left: 4px solid #2f6fb3;
        border-radius: 10px; text-decoration: none; color: #111827; font-size: 16px; background: #fafbfd; }
      .ll-bereich a:hover { border-color: #2f6fb3; background: #eef4fb; }
      .ll-bereich a small { display: block; font-size: 13px; color: #5b6475; }
      html[data-theme="dark"] .ll-bereich { background: #1d222b; border-color: #353c48; border-top-color: #60a5fa; }
      html[data-theme="dark"] .ll-bereich a { background: #252b35; border-color: #353c48; border-left-color: #60a5fa; color: #e8ebf1; }
      html[data-theme="dark"] .ll-bereich a small, html[data-theme="dark"] .ll-info, html[data-theme="dark"] .ll-kopf p { color: #a3acbb; }
    </style>
  </head>
  <body>
    <div data-partial="header" data-partial-path="/core/partials/header.html"></div>

    <main class="page-wrapper">
      <div class="ll-kopf">
        <h1>🔬 das Language Lab</h1>
        <p>die Sprachen lernen: die Karteikarten, das Satzlabor, die Grammatik, die Texte und die Wörter.</p>
      </div>
      <section class="ll-bereiche" id="bereiche"></section>
    </main>

    <div data-partial="footer" data-partial-path="/core/partials/footer.html"></div>

    <script>
      (function () {
        const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        const e3 = (window.Q_ETAGEN || []).find((e) => e.id === "e3");
        if (!e3) return;
        document.getElementById("bereiche").innerHTML = e3.gruppen.map((g) => {
          const links = g.r.flatMap((r) => (Array.isArray(r[4]) ? r[4] : [r]));
          return `<article class="ll-bereich"><h2>${esc(g.t)}</h2>${g.info ? `<p class="ll-info">${esc(g.info)}</p>` : ""}
            ${links.map((r) => `<a href="${esc(r[1])}"${r[5] === "neu" ? ' target="_blank" rel="noopener" data-neues-fenster' : ""}>${esc(r[0])}${r[2] ? `<small>${esc(r[2])}</small>` : ""}</a>`).join("")}</article>`;
        }).join("");
      })();
    </script>
  </body>
</html>
