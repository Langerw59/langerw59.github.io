<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wortdetektiv – Geschichten der Wörter</title>
<!-- 2026-11-04: Wortdetektiv – erstellt mit Claude
     DE: Geschichten der Wörter mit Karte, Wort-Spuren und „Mehr erfahren“-Links.
     RU: Истории слов: карта, «улики» (родственные слова), ссылки «узнать больше».
     Daten: /datenbanken/wortdetektiv/geschichten.js
     Karte: Leaflet + OpenStreetMap (aus dem Internet geladen). -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<script src="../../../datenbanken/wortdetektiv/geschichten.js" defer></script>
<style>
  :root{--bg:#f4f1ea;--card:#fff;--ink:#1d2433;--muted:#5b6475;--line:#d9d3c5;--acc:#6b4fa3;--acc2:#b0742a;--ort:#2f6fb3}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,Segoe UI,Arial,sans-serif}
  main{max-width:860px;margin:0 auto;padding:18px 14px 60px}
  a{color:var(--ort)}
  .oben{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;margin-bottom:10px}
  .oben a{text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink)}
  h1{margin:4px 0 2px;font-size:28px}
  .ru{color:var(--muted)}
  .lead{margin:0 0 18px}
  .karten{display:grid;gap:12px}
  .fall{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:12px;padding:14px 16px}
  .fall:hover{box-shadow:0 3px 14px rgba(0,0,0,.08)}
  .fall b{font-size:19px}
  .fall .nr{font-size:13px;color:var(--acc);font-weight:700;letter-spacing:.4px}
  .fall p{margin:4px 0 0;color:var(--muted);font-size:15px}
  .zur{display:inline-block;margin-bottom:8px;font-size:15px;text-decoration:none}
  .gesch h2{margin:0;font-size:25px;line-height:1.25}
  .gesch .unter{color:var(--muted);margin:2px 0 12px}
  .kurz{background:#fff7e6;border-left:4px solid var(--acc2);padding:8px 12px;border-radius:6px;margin:0 0 14px}
  .text p{margin:0 0 12px}
  .ortlink{color:var(--ort);font-weight:600;cursor:pointer;border-bottom:2px dotted var(--ort);text-decoration:none;white-space:nowrap}
  .ortlink::before{content:"📍";font-size:.8em;margin-right:1px}
  #karte{height:340px;border-radius:12px;border:1px solid var(--line);margin:6px 0 4px;background:#e8eef3}
  .kartehinweis{font-size:13px;color:var(--muted);margin:0 0 16px}
  .kasten{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:16px 0}
  .kasten h3{margin:0 0 8px;font-size:18px}
  .spur{margin:0 0 8px}
  .spur b{color:var(--acc)}
  .links a.lk{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0;background:#faf8f3}
  .links a.lk:hover{background:#fff;border-color:var(--ort)}
  .links .t{font-weight:600;color:var(--ort)}
  .links .i{display:block;font-size:14px;color:var(--muted)}
  .sp{font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;margin-left:6px;background:#eceae4;color:var(--muted);vertical-align:middle}
  .hinweisext{font-size:13px;color:var(--muted);margin:6px 0 0}
  .raetsel button{font:inherit;cursor:pointer;border:1px solid var(--acc);background:#fff;color:var(--acc);border-radius:999px;padding:5px 14px;margin-top:6px}
  .raetsel .antw{display:none;margin-top:8px;padding:8px 12px;background:#efeaf8;border-radius:8px}
  .raetsel.offen .antw{display:block}
  .pfeil{font-size:20px;color:#b33a3a;line-height:1;text-shadow:0 0 3px #fff}
  /* 2026-11-04: Themen-Filter und Wörter zum Anhören */
  .filter{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
  .filter button{font:inherit;font-size:15px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px}
  .filter button.an{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  .filter button .n{opacity:.7;font-size:13px}
  .filter select{font:inherit;font-size:15px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#fff}
  .themakopf{margin:18px 0 8px;font-size:20px;border-bottom:2px solid var(--acc);padding-bottom:4px}
  .chips{margin-top:6px}
  .chip{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;margin-right:4px;background:#eceae4;color:var(--muted)}
  .chip.h{color:#fff}
  .leer{color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
  .ton{color:var(--acc);font-style:italic;cursor:pointer;border-bottom:1px dashed currentColor}
  .ton::after{content:" 🔊";font-size:.7em;font-style:normal;opacity:.75}
  .ton:hover{background:#efeaf8;border-radius:3px}
  .wegname{background:rgba(255,255,255,.85);border:0;box-shadow:none;color:#b33a3a;font-weight:700;font-size:12px;padding:0 4px}
</style>
  <script src="/core/js/core_init.js" defer></script>  <!-- Kopfleiste v2 -->
</head>
<body>
<main>
  <nav class="oben">
    <a href="/etagen.html">🏠 Etagenplan</a>
    <a href="/pages/language_lab/glossar/index.html">📖 Glossar</a>
  </nav>
  <div id="app"></div>
</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  const G = window.WORTDETEKTIV || [];
  const app = document.getElementById("app");
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const HER = { germ: "germanisch", lat: "Latein", frz: "Französisch", griech: "Griechisch", nord: "Altnordisch", orient: "Orient / Asien", amerika: "Amerika (Azteken, Inka …)" };
  const HER_FARBE = { germ: "#1a7f37", lat: "#8250df", frz: "#0969da", griech: "#bf3989", nord: "#9a6700", orient: "#bc4c00", amerika: "#c2410c" };
  const THEMEN = window.WORTDETEKTIV_THEMEN || [];
  let filterThema = "", filterHer = "";

  // ---- Sprachausgabe: Wort in seiner Sprache (Latein → italienische Stimme) ----
  const SPR = { de: "de-DE", en: "en-GB", fr: "fr-FR", it: "it-IT", es: "es-ES", la: "it-IT", ru: "ru-RU", nl: "nl-NL", el: "el-GR" };
  let stimmen = [];
  const ladeStimmen = () => { try { stimmen = speechSynthesis.getVoices() || []; } catch (e) {} };
  if ("speechSynthesis" in window) { ladeStimmen(); speechSynthesis.addEventListener("voiceschanged", ladeStimmen); }
  function sprich(text, l) {
    if (!("speechSynthesis" in window)) return;
    const code = SPR[l] || "de-DE";
    const passend = stimmen.filter((v) => (v.lang || "").toLowerCase().indexOf(code.slice(0, 2)) === 0);
    const v = passend.find((x) => (x.lang || "").replace("_", "-").toLowerCase() === code.toLowerCase() && !/Online|Natural/i.test(x.name)) || passend.find((x) => !/Online|Natural/i.test(x.name)) || passend[0];
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = v ? v.lang : code; if (v) u.voice = v; u.rate = 0.8;
      setTimeout(() => speechSynthesis.speak(u), 60);
    } catch (e) {}
  }
  const SPR_NAME = { de: "Deutsch", en: "Englisch", fr: "Französisch", it: "Italienisch", es: "Spanisch", la: "Latein (italienische Stimme)", ru: "Russisch", nl: "Niederländisch", el: "Griechisch" };
  const ART = { lexikon: "📚", woerterbuch: "📖", video: "▶️", karte: "🗺️" };
  let karte = null, marker = {};

  // **fett** und [[ort:id|Name]] in HTML umwandeln
  function fmt(s) {
    return esc(s)
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/\[\[ort:([a-z0-9_]+)\|([^\]]+)\]\]/g, '<a class="ortlink" data-ort="$1" href="#">$2</a>')
      .replace(/\[\[ton:([a-z]{2})\|([^\]]+)\]\]/g, (m, l, w) => `<span class="ton" data-l="${l}" title="${SPR_NAME[l] || l} – anhören / послушать">${w}</span>`);
  }

  function chipsHtml(g) {
    const t = THEMEN.find((x) => x.id === g.thema);
    return `<div class="chips">${t ? `<span class="chip">${t.icon} ${esc(t.de)}</span>` : ""}${g.h ? `<span class="chip h" style="background:${HER_FARBE[g.h] || "#777"}">${esc(HER[g.h] || g.h)}</span>` : ""}</div>`;
  }
  function karteHtml(g) {
    const nr = G.indexOf(g) + 1;
    return `<a class="fall" href="#${esc(g.id)}">
          <span class="nr">FALL ${nr} · ДЕЛО №${nr}</span><br>
          <b>${esc(g.titel)}</b>
          <p>${esc(g.ru)}</p>${chipsHtml(g)}
        </a>`;
  }

  function liste() {
    const hers = [...new Set(G.map((g) => g.h).filter(Boolean))];
    const passt = (g) => (!filterThema || g.thema === filterThema) && (!filterHer || g.h === filterHer);
    let inhalt = "";
    THEMEN.filter((t) => !filterThema || t.id === filterThema).forEach((t) => {
      const faelle = G.filter((g) => g.thema === t.id && passt(g));
      if (!faelle.length && (filterHer || !filterThema)) { if (!filterThema) return; }
      inhalt += `<h3 class="themakopf">${t.icon} ${esc(t.de)} <span class="ru" style="font-size:15px;font-weight:400">/ ${esc(t.ru)}</span></h3>`;
      inhalt += faelle.length ? `<div class="karten">${faelle.map(karteHtml).join("")}</div>`
        : `<p class="leer">Hier noch keine Fälle. Nenne Claude ein Wort – es kommt hierher. / Здесь пока нет дел. Назовите слово – оно появится здесь.</p>`;
    });
    const ohne = G.filter((g) => !THEMEN.some((t) => t.id === g.thema) && passt(g) && !filterThema);
    if (ohne.length) inhalt += `<h3 class="themakopf">📁 Sonstiges / разное</h3><div class="karten">${ohne.map(karteHtml).join("")}</div>`;
    if (!inhalt) inhalt = `<p class="leer">Nichts gefunden. / Ничего не найдено.</p>`;
    app.innerHTML = `
      <h1>🔍 Wortdetektiv</h1>
      <p class="lead"><span class="ru">Словодетектив – истории слов: откуда пришло слово, кто его принёс, где это на карте.</span></p>
      <div class="filter" id="themen">
        <button type="button" data-t="" class="${filterThema ? "" : "an"}">Alle / все <span class="n">(${G.length})</span></button>
        ${THEMEN.map((t) => `<button type="button" data-t="${t.id}" class="${filterThema === t.id ? "an" : ""}">${t.icon} ${esc(t.de)} <span class="n">(${G.filter((g) => g.thema === t.id).length})</span></button>`).join("")}
      </div>
      <div class="filter">
        <select id="selHer"><option value="">Herkunft: alle / происхождение: все</option>${hers.map((h) => `<option value="${h}" ${filterHer === h ? "selected" : ""}>${esc(HER[h] || h)}</option>`).join("")}</select>
      </div>
      ${inhalt}`;
    app.querySelector("#themen").addEventListener("click", (ev) => {
      const b = ev.target.closest("button[data-t]"); if (!b) return;
      filterThema = b.dataset.t; liste();
    });
    app.querySelector("#selHer").addEventListener("change", (ev) => { filterHer = ev.target.value; liste(); });
    document.title = "Wortdetektiv – Geschichten der Wörter";
  }

  function geschichte(g) {
    const hatKarte = g.orte && Object.keys(g.orte).length > 0;
    app.innerHTML = `
      <a class="zur" href="#">← alle Fälle / все дела</a>
      <article class="gesch">
        <h2>${esc(g.titel)}</h2>
        <p class="unter">${esc(g.ru)}</p>${chipsHtml(g)}<div style="height:10px"></div>
        <p class="kurz">${fmt(g.kurz)}</p>
        ${hatKarte ? `<div id="karte"></div><p class="kartehinweis">Нажмите на 📍 название в тексте – место покажется на карте. Карту можно двигать и увеличивать.</p>` : ""}
        <div class="text">${g.text.map((p) => `<p>${fmt(p)}</p>`).join("")}</div>
        ${g.spuren && g.spuren.length ? `<div class="kasten"><h3>🔎 Wort-Spuren / Улики</h3>${g.spuren.map((s) => `<p class="spur"><b>${esc(s[0])}</b> – ${fmt(s[1])}</p>`).join("")}</div>` : ""}
        ${g.raetsel ? `<div class="kasten raetsel"><h3>❓ Rätsel / Загадка</h3><div>${fmt(g.raetsel.frage)}</div><button type="button">Antwort zeigen / Показать ответ</button><div class="antw">${fmt(g.raetsel.antwort)}</div></div>` : ""}
        ${g.links && g.links.length ? `<div class="kasten links"><h3>🔗 Mehr erfahren / Узнать больше</h3>${g.links.map((l) => `
          <a class="lk" href="${esc(l.url)}" target="_blank" rel="noopener"><span>${ART[l.art] || "🔗"}</span> <span class="t">${esc(l.t)}</span><span class="sp">${esc(l.sp)}</span><span class="i">${esc(l.info)}</span></a>`).join("")}
          <p class="hinweisext">Ссылки ведут на чужие сайты и открываются в новой вкладке.</p></div>` : ""}
      </article>`;
    document.title = g.titel + " – Wortdetektiv";
    window.scrollTo(0, 0);

    const r = app.querySelector(".raetsel button");
    if (r) r.addEventListener("click", () => r.parentNode.classList.toggle("offen"));

    app.querySelectorAll(".ton").forEach((t) => t.addEventListener("click", () => sprich(t.textContent, t.dataset.l)));
    app.querySelectorAll(".ortlink").forEach((a) => a.addEventListener("click", (ev) => {
      ev.preventDefault(); zeigeOrt(a.dataset.ort);
    }));

    if (hatKarte) karteBauen(g);
  }

  function karteBauen(g) {
    const box = document.getElementById("karte");
    if (!window.L) { box.innerHTML = '<p style="padding:20px">Karte konnte nicht geladen werden (kein Internet?). / Карта не загрузилась – нет интернета?</p>'; return; }
    if (karte) { karte.remove(); karte = null; }
    marker = {};
    karte = L.map(box, { scrollWheelZoom: false });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(karte);
    const punkte = [];
    Object.entries(g.orte).forEach(([id, o]) => {
      const m = L.marker([o.lat, o.lng]).addTo(karte).bindPopup(`<b>${esc(o.name)}</b><br>${esc(o.info)}`);
      marker[id] = m; punkte.push([o.lat, o.lng]);
    });
    (g.wege || []).forEach(([von, nach, name]) => {
      const a = g.orte[von], b = g.orte[nach]; if (!a || !b) return;
      L.polyline([[a.lat, a.lng], [b.lat, b.lng]], { color: "#b33a3a", weight: 3, dashArray: "8 6", opacity: .85 })
        .addTo(karte).bindTooltip(esc(name), { permanent: true, direction: "center", className: "wegname" });
      const pf = L.marker([b.lat, b.lng], { interactive: false, icon: L.divIcon({ className: "", html: '<div class="pfeil">➤</div>', iconSize: [20, 20], iconAnchor: [10, 10] }) }).addTo(karte);
      const drehen = () => {
        const p1 = karte.latLngToLayerPoint([a.lat, a.lng]), p2 = karte.latLngToLayerPoint([b.lat, b.lng]);
        const w = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI;
        const el = pf.getElement(); if (el && el.firstChild) el.firstChild.style.transform = `translate(-14px,0) rotate(${w}deg)`;
      };
      karte.on("zoomend viewreset", drehen); setTimeout(drehen, 0);
    });
    karte.fitBounds(punkte, { padding: [25, 25] });
  }

  function zeigeOrt(id) {
    const m = marker[id]; if (!m || !karte) return;
    document.getElementById("karte").scrollIntoView({ behavior: "smooth", block: "center" });
    karte.flyTo(m.getLatLng(), 8, { duration: 1.2 });
    setTimeout(() => m.openPopup(), 1300);
  }

  function route() {
    const id = decodeURIComponent(location.hash.slice(1));
    const g = G.find((x) => x.id === id);
    if (karte && !g) { karte.remove(); karte = null; }
    g ? geschichte(g) : liste();
  }
  window.addEventListener("hashchange", route);
  // Leaflet wird mit "defer" geladen – ist beim DOMContentLoaded schon da
  route();
});
</script>
</body>
</html>
