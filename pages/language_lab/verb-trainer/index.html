<!DOCTYPE html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Der Verb-Trainer – das Verb + die Präposition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../../core/assets/style.css" />
    <script src="../../../core/js/core_init.js" defer></script>
    <script src="../../../datenbanken/de/de_verb_praeposition.js" defer></script>
    <!-- 2026-11-25: der Verb-Trainer – erstellt mit Claude
         DE: Welches Verb braucht welche Präposition und welchen Kasus? Dazu Wohin?/Wo? (nach Hause / zu Hause).
             Kette: das Verb → die Präposition → der Kasus → der Artikel.
         RU: Тренажёр: какой глагол с каким предлогом и падежом + «куда? / где?».
         Daten: /datenbanken/de/de_verb_praeposition.js · Fortschritt: localStorage „verbtrainer_v1“ (pro Gerät)
         Regel: /pages/language_lab/grammatik/index.html#de-verb-mit-praeposition -->
    <style>
      .vt-wrap { max-width: 900px; margin: 0 auto; }
      .vt-sub { color: var(--text-muted, #59636e); margin-top: 0; }
      .vt-kette { font-weight: 700; border: 2px solid #8250df; border-radius: 12px; padding: 8px 14px; background: rgba(130,80,223,.06); margin: 8px 0 12px; }
      .vt-knopf { font: inherit; font-size: 17px; cursor: pointer; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--accent, #1f6feb); background: var(--accent, #1f6feb); color: #fff; font-weight: 700; margin: 6px 4px 0 0; touch-action: manipulation; text-decoration: none; display: inline-block; }
      .vt-knopf.leicht { background: transparent; color: inherit; }
      .vt-gruppen { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
      .vt-gruppen button { font: inherit; cursor: pointer; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border-subtle, #d0d7de); background: var(--bg-surface, #fff); color: inherit; }
      .vt-gruppen button.an { background: #8250df; border-color: #8250df; color: #fff; }
      .vt-modi { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin: 12px 0; }
      .vt-modi button { font: inherit; text-align: left; cursor: pointer; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--border-subtle, #d0d7de); background: var(--bg-surface, #fff); color: inherit; }
      .vt-modi button b { font-size: 18px; display: block; }
      .vt-modi button small { color: var(--text-muted, #59636e); }
      .vt-balken { height: 10px; border-radius: 5px; background: var(--border-subtle, #d0d7de); overflow: hidden; margin: 4px 0 2px; }
      .vt-balken span { display: block; height: 100%; background: #1a7f37; }
      .vt-klein { color: var(--text-muted, #59636e); font-size: 14px; }
      .vt-stand { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--text-muted, #59636e); font-size: 15px; }
      .vt-ru { font-size: 18px; color: var(--text-muted, #59636e); margin-top: 12px; }
      .vt-frage { font-size: 27px; font-weight: 800; margin: 6px 0; line-height: 1.3; }
      .vt-frage .luecke { display: inline-block; min-width: 80px; border-bottom: 3px solid #8250df; }
      .vt-wdh { display: inline-block; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 2px 10px; background: #d29922; color: #fff; }
      .vt-wahl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
      .vt-wahl button { font: inherit; font-size: 20px; font-weight: 600; padding: 14px 10px; border-radius: 14px; border: 2px solid var(--border-subtle, #d0d7de); background: var(--bg-surface, #fff); color: inherit; cursor: pointer; touch-action: manipulation; }
      .vt-wahl button.richtig { background: #1a7f37; border-color: #1a7f37; color: #fff; }
      .vt-wahl button.falsch { background: #cf222e; border-color: #cf222e; color: #fff; }
      .vt-wahl button:disabled { cursor: default; }
      .vt-erkl { border-left: 4px solid #8250df; background: rgba(130,80,223,.07); padding: 8px 12px; border-radius: 6px; font-size: 17px; }
      .vt-erg { text-align: center; font-size: 22px; margin: 16px 0; }
      .vt-erg b { font-size: 40px; display: block; }
      .vt-suche { font: inherit; font-size: 17px; width: 100%; box-sizing: border-box; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-subtle, #d0d7de); background: var(--bg-surface, #fff); color: inherit; margin: 6px 0 10px; }
      .vt-tab { width: 100%; border-collapse: collapse; font-size: 16px; }
      .vt-tab th, .vt-tab td { border-bottom: 1px solid var(--border-subtle, #d0d7de); padding: 6px; text-align: left; vertical-align: top; }
      .vt-tab td.v { font-weight: 700; white-space: nowrap; }
      .vt-tab .k { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 6px; color: #fff; }
      .vt-tab .k.akk { background: #1f6feb; } .vt-tab .k.dat { background: #bf3989; }
      .vt-tab button { font: inherit; cursor: pointer; border: none; background: transparent; font-size: 18px; }
      .vt-tab h3 { margin: 14px 0 4px; }
      @media (max-width: 600px) { .vt-wahl { grid-template-columns: 1fr; } .vt-frage { font-size: 22px; } .vt-tab td.v { white-space: normal; } }
      @media (orientation: landscape) and (max-height: 560px) { .vt-frage { font-size: 22px; margin: 2px 0; } .vt-wahl button { padding: 8px; font-size: 17px; } .vt-ru { margin-top: 2px; } }
    </style>
  </head>
  <body data-lernzeit="Verb-Trainer">
    <div data-partial="header" data-partial-path="../../../core/partials/header.html"></div>
    <main class="page-wrapper">
      <div class="card vt-wrap" id="vtApp"><p>Lädt …</p></div>
    </main>
    <script>
    (function () {
      const KEY = "verbtrainer_v1";
      const PRO_RUNDE = 10, GELERNT = 3;            // 3 × hintereinander richtig = gelernt
      const REGEL = "../grammatik/index.html#de-verb-mit-praeposition";
      const GRUPPEN = {
        alle: { t: "alle", ru: "все" },
        akk:  { t: "Verb + Präposition + Akkusativ", ru: "глагол + предлог + винительный" },
        dat:  { t: "Verb + Präposition + Dativ", ru: "глагол + предлог + дательный" },
        ohne: { t: "Verb OHNE Präposition", ru: "без предлога – русская ловушка" },
        ort:  { t: "Wohin? / Wo? (nach Hause …)", ru: "куда? / где?" }
      };
      let st = {}; try { st = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (_) {}
      st.serie = st.serie || {};   // Schlüssel → richtige Antworten hintereinander
      st.fehler = st.fehler || {}; // Schlüssel → true (die Fehlerkiste)
      st.gruppe = st.gruppe || "alle";
      const speichern = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (_) {} };
      const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const mische = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
      const app = document.getElementById("vtApp");
      const D = () => window.DE_VERB_PRAEPOSITION || [];
      const KN = { akk: "Akkusativ", dat: "Dativ" };
      const schl = (e) => e.v;                       // Schlüssel = das Verb / die Wendung
      const gelernt = (e) => (st.serie[schl(e)] || 0) >= GELERNT;
      const inGruppe = (e) => st.gruppe === "alle" || e.g === st.gruppe;
      const formel = (e) => e.p ? `${e.p} + ${KN[e.k]}` : `+ ${KN[e.k]} (ohne Präposition)`;

      function sprich(text) {
        try {
          if (!window.speechSynthesis || !text) return;
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = "de-DE"; u.rate = 0.9;
          const v = speechSynthesis.getVoices().find((x) => x.lang && x.lang.toLowerCase().startsWith("de"));
          if (v) u.voice = v;
          speechSynthesis.speak(u);
        } catch (_) {}
      }
      // die Lücke nur als ganzes Wort ersetzen
      function mitLuecke(e, ersatz) {
        const re = new RegExp("(^|[^A-Za-zÄÖÜäöüß])" + e.l.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?=[^A-Za-zÄÖÜäöüß]|$)");
        return e.s.replace(re, (m, vor) => vor + ersatz);
      }

      // ---------- die Übersicht ----------
      function start() {
        const alle = D(); if (!alle.length) { app.innerHTML = "<p>Keine Daten gefunden.</p>"; return; }
        const liste = alle.filter(inGruppe);
        const g = liste.filter(gelernt).length, fk = Object.keys(st.fehler).filter((k) => liste.some((e) => schl(e) === k)).length;
        app.innerHTML = `<h1>🧩 Der Verb-Trainer</h1>
          <p class="vt-sub">Welches Verb braucht welche Präposition und welchen Kasus? Und: Wohin? oder Wo?<br>
          <small>Какой глагол с каким предлогом и падежом? И куда? или где? (nach Hause / zu Hause)</small></p>
          <div class="vt-kette">das Verb → die Präposition → der Kasus → der Artikel &nbsp;·&nbsp; warten → auf → Akkusativ → auf <u>den</u> Bus</div>
          <div class="vt-gruppen">${Object.keys(GRUPPEN).map((k) => `<button data-g="${k}" class="${st.gruppe === k ? "an" : ""}" title="${esc(GRUPPEN[k].ru)}">${esc(GRUPPEN[k].t)}</button>`).join("")}</div>
          <div class="vt-klein">${esc(GRUPPEN[st.gruppe].ru)} · gelernt ${g} von ${liste.length} <small>(gelernt = ${GELERNT}× hintereinander richtig)</small></div>
          <div class="vt-balken"><span style="width:${liste.length ? Math.round(g / liste.length * 100) : 0}%"></span></div>
          <div class="vt-modi">
            <button id="vtSatz"><b>📝 der Satz</b><small>Lücke füllen: Ich warte ___ Bus. · вставить предлог + артикль</small></button>
            <button id="vtFormel"><b>🔤 Verb + ?</b><small>warten → auf + Akkusativ · запомнить «формулу» глагола</small></button>
            <button id="vtListe"><b>📋 die Liste</b><small>alles nachschlagen, mit 🔊 · весь список для чтения</small></button>
            ${fk ? `<button id="vtFehler"><b>🔁 die Fehlerkiste (${fk})</b><small>nur die Fehler wiederholen · только ошибки</small></button>` : ""}
          </div>
          <a class="vt-knopf leicht" href="${REGEL}" target="quantura_regel">📐 die Regel lesen ↗</a>
          <p class="vt-klein">Der Fortschritt wird auf diesem Gerät gespeichert. / Прогресс сохраняется на этом устройстве.</p>`;
        app.querySelectorAll(".vt-gruppen button").forEach((b) => b.onclick = () => { st.gruppe = b.dataset.g; speichern(); start(); });
        document.getElementById("vtSatz").onclick = () => lauf(auswahl(liste, false), "satz");
        document.getElementById("vtFormel").onclick = () => lauf(auswahl(liste.filter((e) => e.g !== "ort"), false), "formel");
        document.getElementById("vtListe").onclick = () => zeigeListe("");
        const f = document.getElementById("vtFehler");
        if (f) f.onclick = () => lauf(auswahl(liste, true), "satz");
      }

      // Fehler zuerst, dann noch nicht Gelerntes, dann der Rest
      function auswahl(liste, nurFehler) {
        if (!liste.length) return [];
        const fehler = mische(liste.filter((e) => st.fehler[schl(e)]));
        if (nurFehler) return fehler;
        const neu = mische(liste.filter((e) => !st.fehler[schl(e)] && !gelernt(e)));
        const rest = mische(liste.filter((e) => !st.fehler[schl(e)] && gelernt(e)));
        return fehler.slice(0, 3).concat(neu, fehler.slice(3), rest).slice(0, PRO_RUNDE);
      }

      // falsche „Formeln“ für den Modus Verb + ?
      function falscheFormeln(e) {
        const richtig = formel(e), aus = new Set([richtig]), res = [];
        const nimm = (t) => { if (!aus.has(t) && res.length < 3) { aus.add(t); res.push(t); } };
        const anderer = e.k === "akk" ? "dat" : "akk";
        if (e.p) nimm(`${e.p} + ${KN[anderer]}`); else nimm(`+ ${KN[anderer]} (ohne Präposition)`);
        if (!e.p) { // russische Falle: mit Präposition raten
          nimm(e.k === "dat" ? "für + Akkusativ" : "zu + Dativ");
        }
        mische(D().filter((x) => x.g !== "ort" && x.p && x.p !== e.p)).forEach((x) => nimm(formel(x)));
        return res;
      }

      // ---------- der Test ----------
      function lauf(fr, modus) {
        if (!fr.length) { app.innerHTML = `<p>Hier gibt es nichts zu üben. / Здесь пока нечего повторять.</p><button class="vt-knopf" id="vtZur">Zur Übersicht</button>`; document.getElementById("vtZur").onclick = start; return; }
        let i = 0, richtig = 0;
        function zeige() {
          if (i >= fr.length) return ende();
          const e = fr[i];
          let frage, opt;
          if (modus === "formel") {
            frage = `<div class="vt-ru">${esc(e.ru)}</div><div class="vt-frage">${esc(e.v.replace(/ \+ .*$/, "").replace(new RegExp(" " + e.p + "$"), ""))} → ?</div>`;
            opt = mische([{ t: formel(e), ok: true }].concat(falscheFormeln(e).map((t) => ({ t, ok: false }))));
          } else {
            const teile = mitLuecke(e, "\u0000").split("\u0000");
            frage = `<div class="vt-ru">${esc(e.sr)}</div><div class="vt-frage">${esc(teile[0])}<span class="luecke">&nbsp;</span>${esc(teile[1] || "")}</div>`;
            opt = mische([{ t: e.l, ok: true }].concat(e.f.map((t) => ({ t, ok: false }))));
          }
          app.innerHTML = `<div class="vt-stand"><span>${modus === "formel" ? "🔤 Verb + ?" : "📝 der Satz"} · ${esc(GRUPPEN[e.g].t)}</span><span>Frage ${i + 1} von ${fr.length}</span></div>
            ${st.fehler[schl(e)] ? `<span class="vt-wdh">🔁 aus der Fehlerkiste</span>` : ""}
            ${frage}
            <div class="vt-wahl">${opt.map((o, k) => `<button data-k="${k}">${esc(o.t)}</button>`).join("")}</div>
            <div id="vtNach"></div>`;
          app.querySelectorAll(".vt-wahl button").forEach((b) => b.onclick = () => {
            const o = opt[+b.dataset.k], key = schl(e);
            app.querySelectorAll(".vt-wahl button").forEach((bb) => { bb.disabled = true; if (opt[+bb.dataset.k].ok) bb.classList.add("richtig"); });
            if (o.ok) { richtig++; st.serie[key] = (st.serie[key] || 0) + 1; delete st.fehler[key]; }
            else { b.classList.add("falsch"); st.serie[key] = 0; st.fehler[key] = true; }
            speichern();
            document.getElementById("vtNach").innerHTML = `<div class="vt-erkl">${o.ok ? "✅ <b>Richtig!</b>" : "❌ <b>Nicht ganz.</b>"}
              <b>${esc(e.s)}</b> – ${esc(e.sr)}<br>
              🧩 <b>${esc(e.v)}</b> = ${esc(formel(e))} · ${esc(e.ru)} · <i>${esc(e.en)}</i>
              ${e.h ? `<br>💡 ${esc(e.h)}` : ""}</div>
              <button class="vt-knopf leicht" id="vtHoer">🔊 anhören</button>
              <button class="vt-knopf" id="vtWeiter">Weiter ➜</button>`;
            document.getElementById("vtHoer").onclick = () => sprich(e.s);
            sprich(e.s);
            const w = document.getElementById("vtWeiter"); w.focus();
            w.onclick = () => { i++; zeige(); };
          });
        }
        function ende() {
          app.innerHTML = `<div class="vt-erg">Ergebnis / результат<b>${richtig} / ${fr.length}</b>${Math.round(richtig / fr.length * 100)} %</div>
            <p class="vt-klein" style="text-align:center">Fehler kommen in die Fehlerkiste und kommen in der nächsten Runde zuerst. / Ошибки попадают в «ящик ошибок» и в следующий раз идут первыми.</p>
            <p style="text-align:center"><button class="vt-knopf" id="vtNochmal">▶ noch eine Runde</button> <button class="vt-knopf leicht" id="vtZur">Zur Übersicht</button></p>`;
          document.getElementById("vtZur").onclick = start;
          document.getElementById("vtNochmal").onclick = () => {
            const liste = D().filter(inGruppe);
            lauf(auswahl(modus === "formel" ? liste.filter((x) => x.g !== "ort") : liste, false), modus);
          };
        }
        zeige();
      }

      // ---------- die Liste zum Nachschlagen ----------
      function zeigeListe(such) {
        const q = such.trim().toLowerCase();
        const passt = (e) => !q || [e.v, e.ru, e.en, e.s, e.sr].join(" ").toLowerCase().includes(q);
        const gruppen = ["akk", "dat", "ohne", "ort"].filter((g) => st.gruppe === "alle" || st.gruppe === g);
        let h = `<h1>📋 die Liste</h1>
          <button class="vt-knopf leicht" id="vtZur">← Zur Übersicht</button>
          <input class="vt-suche" id="vtSuche" placeholder="suchen … (z. B. warten, Hause, denken)" value="${esc(such)}">
          <table class="vt-tab">`;
        gruppen.forEach((g) => {
          const zeilen = D().filter((e) => e.g === g && passt(e));
          if (!zeilen.length) return;
          h += `<tr><td colspan="4"><h3>${esc(GRUPPEN[g].t)} <small class="vt-klein">· ${esc(GRUPPEN[g].ru)}</small></h3></td></tr>`;
          zeilen.forEach((e) => {
            const n = D().indexOf(e);
            h += `<tr><td class="v">${gelernt(e) ? "✅ " : ""}${esc(e.v)}<br><span class="k ${e.k}">${esc(formel(e))}</span></td>
              <td>${esc(e.ru)}<br><small class="vt-klein">${esc(e.en)}</small></td>
              <td><b>${esc(e.s)}</b><br><small class="vt-klein">${esc(e.sr)}</small>${e.h ? `<br><small>💡 ${esc(e.h)}</small>` : ""}</td>
              <td><button data-n="${n}" title="anhören">🔊</button></td></tr>`;
          });
        });
        h += `</table>`;
        app.innerHTML = h;
        document.getElementById("vtZur").onclick = start;
        const s = document.getElementById("vtSuche");
        s.oninput = () => { const pos = s.selectionStart; zeigeListe(s.value); const n = document.getElementById("vtSuche"); n.focus(); n.setSelectionRange(pos, pos); };
        app.querySelectorAll(".vt-tab button").forEach((b) => b.onclick = () => sprich(D()[+b.dataset.n].s));
      }

      function bereit() { if (window.DE_VERB_PRAEPOSITION) start(); else setTimeout(bereit, 50); }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bereit); else bereit();
    })();
    </script>
  </body>
</html>
