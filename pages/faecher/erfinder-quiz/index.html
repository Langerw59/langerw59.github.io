<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Das Erfinder-Quiz – Quantura</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="/core/js/core_init.js" defer></script>  <!-- Kopfleiste v2 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: freundlich, lehrreich, wie ein guter Lehrer am Globus
   IDEA: die Blaupause / das Patentblatt – Erfindungen auf der Weltkarte
   PICTURE: die Weltkarte selbst, mit gelben Nadeln am Ort der Erfindung
   COLOUR and TYPE: Blaupausen-Blau, Weiß, Signalgelb; Barlow + Barlow Condensed
   LAYOUT: Karte links groß, Frage rechts; schmal: Karte oben, Frage darunter */
:root{color-scheme:light dark;
--bg:light-dark(#eef3f9,#0b1829);--panel:light-dark(#ffffff,#112540);--ink:light-dark(#10233d,#e8f0fa);
--soft:light-dark(#4a5f7a,#a9bdd6);--line:light-dark(#c9d6e6,#25406a);--blue:light-dark(#1d5fa8,#6aa8ec);
--sea:light-dark(#dce7f3,#0b1829);--land:light-dark(#b9cbe0,#27466f);--landh:light-dark(#9fb6d1,#33598a);
--gold:#ffc81e;--ok:light-dark(#1f7a3d,#5fd38a);--okbg:light-dark(#e3f4e8,#143a25);--bad:light-dark(#b3261e,#ff8a80);--badbg:light-dark(#fbe6e4,#3e1a1a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
a{color:var(--blue)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-rows:auto 1fr;min-height:calc(100vh - 90px)}
.titel{grid-column:1/-1;margin:0;padding:10px max(2vw,12px);font:700 26px/1.1 "Barlow Condensed",sans-serif;border-bottom:1px solid var(--line)}
.titel span{font-weight:600;color:var(--soft);font-size:18px}
.mapwrap{position:relative;background:var(--sea);min-height:420px;border-right:1px solid var(--line)}
#map{position:absolute;inset:0}
.leaflet-tooltip.ort{font:700 14px Barlow,sans-serif;color:#10233d;border:1px solid #10233d}
.leaflet-container{background:var(--sea);font:14px Barlow,sans-serif}
.maphint{position:absolute;z-index:500;position:absolute;left:12px;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--soft)}
.maperr{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--soft)}
.side{padding:clamp(14px,2vw,28px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip:disabled{opacity:.5;cursor:default}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--soft);font-weight:600;font-size:15px}
.q{font:700 clamp(22px,2.4vw,30px)/1.15 "Barlow Condensed",sans-serif;margin:0;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{min-height:50px;text-align:left;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-weight:600;font-size:17px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h3{margin:0 0 4px;font:700 20px/1.2 "Barlow Condensed",sans-serif}
.card p{margin:6px 0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:6px 0 8px}
.facts dt{color:var(--soft);font-weight:600}.facts dd{margin:0;font-weight:600}
.wort{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-weight:600}
.next{min-height:50px;border-radius:12px;border:0;background:var(--blue);color:#fff;font-weight:700;font-size:18px;padding:0 20px}
.end{text-align:center}
.end .big{font:700 64px/1 "Barlow Condensed",sans-serif;color:var(--blue)}
.small{font-size:13px;color:var(--soft)}
.vorlesen{min-height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--blue);background:var(--panel);color:var(--blue);font-weight:700;align-self:flex-start}
.vorlesen[aria-pressed=true]{background:var(--blue);color:#fff}
@media (max-width:820px){main{grid-template-columns:1fr}.mapwrap{min-height:44vh;border-right:0;border-bottom:1px solid var(--line)}}
@media (max-height:520px) and (orientation:landscape){main{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}.mapwrap{min-height:70vh}.titel{display:none}.q{font-size:20px}.opt{min-height:40px;padding:6px 12px;font-size:15px}.side{gap:8px;padding:10px}}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}
</style>
</head>
<body>
<main>
  <h1 class="titel">Das Erfinder-Quiz <span>· Wer hat es erfunden – und wo?</span></h1>
  <section class="mapwrap" aria-label="Die Weltkarte">
    <div id="map"></div>
    <div class="maperr" id="maperr">Die Karte konnte nicht geladen werden. Den Ort öffnen Sie über den Link „Auf der Karte öffnen“.</div>
    <div class="maphint" id="maphint">Erst raten – dann zeigt die Karte, wo die Erfindung entstanden ist.</div>
  </section>
  <section class="side" id="side" aria-live="polite"></section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
{
const THEMEN=[{id:'technik',name:'die Technik',aktiv:true},{id:'tiere',name:'die Tiere',aktiv:false},{id:'entdeckungen',name:'die Entdeckungen',aktiv:false}];
const FRAGEN=[
{ding:'die Schreibmaschine',frage:'Wer erhielt 1868 das Patent auf die Schreibmaschine, aus der unsere heutige Tastatur entstand?',
 opts:['Christopher Latham Sholes','Thomas Alva Edison','Werner von Siemens','Alexander Graham Bell'],r:0,
 wer:'Christopher Latham Sholes (mit Carlos Glidden und Samuel Soule)',wo:'Milwaukee, USA',wann:'1868 (Patent), ab 1874 in Serie bei Remington',
 text:'Von Sholes stammt die Tastenanordnung QWERTY – unsere deutsche QWERTZ ist ihre Schwester. Eine einzige Erfindung gab es aber nicht: Schon 1864 baute der Tischler Peter Mitterhofer in Partschins (Südtirol) eine hölzerne Schreibmaschine und ging damit zu Fuß nach Wien zum Kaiser. In Kopenhagen baute Pastor Rasmus Malling-Hansen um 1865 die Schreibkugel – Friedrich Nietzsche schrieb später damit.',
 wort:'die Maschine – über das Französische von lat. machina, griech. mēchanḗ „das Werkzeug, der Kunstgriff“.',
 wiki:'Christopher_Latham_Sholes',orte:[['Milwaukee',43.04,-87.91],['Partschins',46.68,11.07],['Kopenhagen',55.68,12.57]]},
{ding:'das Telefon',frage:'Welcher deutsche Lehrer führte 1861 ein Gerät vor, das er selbst „Telephon“ nannte?',
 opts:['Philipp Reis','Werner von Siemens','Heinrich Hertz','Georg Simon Ohm'],r:0,
 wer:'Philipp Reis, Lehrer in Friedrichsdorf (Taunus)',wo:'Friedrichsdorf; Vorführung in Frankfurt am Main',wann:'1861',
 text:'Reis zeigte sein Gerät im Physikalischen Verein in Frankfurt am Main. Es übertrug Töne und Melodien, Sprache aber nur schlecht. 1876 erhielt Alexander Graham Bell in den USA das Patent auf das Telefon; sein Labor war in Boston. Wer „der Erfinder“ ist, wird bis heute diskutiert.',
 wort:'das Telefon – griech. tēle „fern“ + phōnḗ „die Stimme, der Laut“: die „Fernstimme“.',
 wiki:'Philipp_Reis',orte:[['Friedrichsdorf',50.25,8.64],['Boston',42.36,-71.06]]},
{ding:'das Automobil',frage:'Wer meldete 1886 das erste Automobil mit Benzinmotor zum Patent an?',
 opts:['Gottlieb Daimler','Carl Benz','Rudolf Diesel','Henry Ford'],r:1,
 wer:'Carl Benz',wo:'Mannheim',wann:'29. Januar 1886 (Patent Nr. 37435)',
 text:'Der „Benz Patent-Motorwagen“ hatte drei Räder. Berühmt wurde er durch Bertha Benz: 1888 fuhr sie ohne Wissen ihres Mannes mit den Söhnen von Mannheim nach Pforzheim – die erste lange Autofahrt der Welt. Fast gleichzeitig baute Gottlieb Daimler in Cannstatt sein eigenes Motorfahrzeug.',
 wort:'das Automobil – griech. autós „selbst“ + lat. mobilis „beweglich“: „das Selbstbewegliche“.',
 wiki:'Carl_Benz',orte:[['Mannheim',49.49,8.47],['Pforzheim',48.89,8.70]]},
{ding:'der Buchdruck',frage:'Wer erfand um 1450 den Buchdruck mit beweglichen Buchstaben aus Metall?',
 opts:['Martin Luther','Albrecht Dürer','Johannes Gutenberg','Johannes Kepler'],r:2,
 wer:'Johannes Gutenberg',wo:'Mainz',wann:'um 1450; die Gutenberg-Bibel um 1454',
 text:'Gutenberg goss einzelne Buchstaben aus Metall, die man immer wieder neu zusammensetzen konnte. Seine Bibel wurde in etwa 180 Exemplaren gedruckt. Ohne den Buchdruck hätte sich auch Luthers Bibelübersetzung später nicht so schnell verbreitet.',
 wort:'der Buchstabe – vermutlich von Stäben aus Buchenholz, in die man früher Runen ritzte.',
 wiki:'Johannes_Gutenberg',orte:[['Mainz',49.99,8.25]]},
{ding:'die Glühlampe',frage:'Wer brachte 1879 eine lange brennende Glühlampe zum Erfolg?',
 opts:['Nikola Tesla','Thomas Alva Edison','Alessandro Volta','Werner von Siemens'],r:1,
 wer:'Thomas Alva Edison',wo:'Menlo Park, New Jersey (USA)',wann:'1879',
 text:'Edison probierte tausende Materialien für den Glühfaden aus, bis ein verkohlter Faden viele Stunden brannte. Fast gleichzeitig zeigte Joseph Swan in Newcastle (England) eine eigene Glühlampe. Später gründeten beide sogar eine gemeinsame Firma.',
 wort:'die Lampe – über das Französische von griech. lampás „die Fackel“.',
 wiki:'Thomas_Alva_Edison',orte:[['Menlo Park',40.56,-74.33],['Newcastle',54.98,-1.62]]},
{ding:'der Dieselmotor',frage:'Wer entwickelte in Augsburg einen Motor, der ohne Zündkerze arbeitet?',
 opts:['Nikolaus August Otto','Rudolf Diesel','Gottlieb Daimler','Wilhelm Maybach'],r:1,
 wer:'Rudolf Diesel',wo:'Augsburg (Maschinenfabrik Augsburg, heute MAN)',wann:'1893 erster Versuchsmotor, 1897 betriebsbereit',
 text:'Im Dieselmotor wird die Luft so stark verdichtet, dass sie sehr heiß wird – der eingespritzte Kraftstoff entzündet sich dann von selbst. Diesel wurde 1858 in Paris geboren und studierte in München.',
 wort:'der Diesel – ein Eponym: ein Wort, das aus einem Personennamen entstanden ist (wie die Draisine).',
 wiki:'Rudolf_Diesel',orte:[['Augsburg',48.37,10.90]]},
{ding:'die Laufmaschine',frage:'Wer erfand 1817 die Laufmaschine – den Vorläufer des Fahrrads?',
 opts:['Karl Drais','Carl Benz','Pierre Michaux','John Kemp Starley'],r:0,
 wer:'Karl Drais, Forstbeamter',wo:'Mannheim',wann:'12. Juni 1817',
 text:'Die Laufmaschine hatte keine Pedale: Man stieß sich mit den Füßen vom Boden ab. Bei der ersten Fahrt von Mannheim bis zum Schwetzinger Relaishaus brauchte Drais für etwa 7 km weniger als eine Stunde – schneller als jede Postkutsche. Mannheim ist also die Stadt von zwei Erfindungen in diesem Quiz!',
 wort:'die Draisine – nach Karl Drais benannt; heute heißt so ein kleines Schienenfahrzeug.',
 wiki:'Karl_Drais',orte:[['Mannheim',49.49,8.47]]},
{ding:'der Computer',frage:'Wer baute 1941 in Berlin den ersten funktionsfähigen programmierbaren Computer?',
 opts:['Alan Turing','John von Neumann','Konrad Zuse','Charles Babbage'],r:2,
 wer:'Konrad Zuse, Bauingenieur',wo:'Berlin',wann:'1941 (die Z3)',
 text:'Zuse begann schon 1936 in der Wohnung seiner Eltern in Berlin-Kreuzberg. Die Z3 rechnete im Binärsystem – mit Nullen und Einsen, wie Sie es im Informatikunterricht erklärt haben – und bestand aus etwa 2600 Relais. 1943 wurde sie bei einem Bombenangriff zerstört; ein Nachbau steht im Deutschen Museum in München.',
 wort:'der Computer – engl. to compute, von lat. computare „berechnen“. Früher war „computer“ ein Mensch, der rechnete.',
 wiki:'Konrad_Zuse',orte:[['Berlin',52.50,13.39]]},
{ding:'das Flugzeug',frage:'Wem gelang 1903 der erste gesteuerte Motorflug?',
 opts:['Otto Lilienthal','den Gebrüdern Wright','Ferdinand Graf von Zeppelin','Louis Blériot'],r:1,
 wer:'Orville und Wilbur Wright',wo:'Kitty Hawk, North Carolina (USA)',wann:'17. Dezember 1903',
 text:'Der erste Flug dauerte nur 12 Sekunden und ging etwa 37 Meter weit. Die Brüder Wright hatten vorher die Gleitflüge von Otto Lilienthal genau studiert: Er flog ab 1891 in Berlin-Lichterfelde und gilt als der erste Mensch, der wiederholt erfolgreich segelte.',
 wort:'das Flugzeug – „das Zeug“ ist ein altes Wort für das Gerät, wie in das Werkzeug und das Fahrzeug.',
 wiki:'Gebrüder_Wright',orte:[['Kitty Hawk',36.06,-75.70],['Berlin-Lichterfelde',52.43,13.31]]},
{ding:'das Radio',frage:'Wer zeigte am 7. Mai 1895 in Sankt Petersburg einen Empfänger für Funkwellen?',
 opts:['Guglielmo Marconi','Heinrich Hertz','Alexander Popow','Ferdinand Braun'],r:2,
 wer:'Alexander Stepanowitsch Popow, Physiklehrer',wo:'Sankt Petersburg',wann:'7. Mai 1895',
 text:'In Russland ist der 7. Mai bis heute „der Tag des Radios“. Im selben Jahr experimentierte Guglielmo Marconi bei Bologna und erhielt 1896 in England ein Patent. Die Grundlage schuf Heinrich Hertz: Er wies 1886–1888 in Karlsruhe die elektromagnetischen Wellen nach.',
 wort:'das Radio – lat. radius „der Strahl“; daher auch der Radius beim Kreis.',
 wiki:'Alexander_Stepanowitsch_Popow',orte:[['Sankt Petersburg',59.93,30.36],['Bologna',44.49,11.34],['Karlsruhe',49.01,8.40]]}
];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let thema='technik',i=0,punkte=0,beantwortet=false,map=null;
/* die Sprachausgabe – nutzt die gewählte Stimme aus der Kopfleiste (TTSManager) */
let sprichtGerade=false;
function stumm(){sprichtGerade=false;try{speechSynthesis.cancel();}catch(e){}document.querySelectorAll('.vorlesen').forEach(b=>{b.setAttribute('aria-pressed','false');b.textContent='🔊 Vorlesen';});}
function vorlesen(btn,text){
  const war=btn.getAttribute('aria-pressed')==='true';stumm();if(war)return;
  if(!('speechSynthesis' in window)){alert('Dieser Browser kann leider nicht vorlesen.');return;}
  btn.setAttribute('aria-pressed','true');btn.textContent='⏹ Stopp';sprichtGerade=true;
  const fertig=()=>{if(!sprichtGerade)return;sprichtGerade=false;btn.setAttribute('aria-pressed','false');btn.textContent='🔊 Vorlesen';};
  if(window.TTSManager){window.TTSManager.speak(text,'de').then(()=>{const t=setInterval(()=>{if(!speechSynthesis.speaking&&!speechSynthesis.pending){clearInterval(t);fertig();}},400);});}
  else{const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.onend=fertig;u.onerror=fertig;speechSynthesis.speak(u);}
}
function frageText(f){return f.frage+' '+f.opts.map((o,k)=>'Antwort '+(k+1)+': '+o+'.').join(' ');}
function infoText(f){return f.ding+'. Wer? '+f.wer+'. Wo? '+f.wo+'. Wann? '+f.wann+'. '+f.text+' Das Wort: '+f.wort;}


let ebene=null;
function karteStart(){
  try{
    map=L.map('map',{worldCopyJump:true,zoomControl:true}).setView([48,10],4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap-Mitwirkende'}).addTo(map);
    ebene=L.layerGroup().addTo(map);
    new ResizeObserver(()=>map.invalidateSize()).observe(document.getElementById('map'));
  }catch(e){$('#maperr').style.display='flex';map=null;}
}
function zeigeOrte(orte){
  if(!map)return;
  ebene.clearLayers();
  orte.forEach((o,n)=>{L.circleMarker([o[1],o[2]],{radius:n?8:11,color:'#10233d',weight:2,fillColor:'#ffc81e',fillOpacity:1}).addTo(ebene).bindTooltip(o[0],{permanent:true,direction:'right',offset:[10,0],className:'ort'});});
  if(orte.length===1)map.flyTo([orte[0][1],orte[0][2]],9,{duration:1.2});
  else map.flyToBounds(orte.map(o=>[o[1],o[2]]),{padding:[60,60],maxZoom:9,duration:1.2});
}
function leereKarte(){if(!map)return;ebene.clearLayers();map.setView([48,10],4);$('#maphint').style.display='';}

function themenLeiste(){
  return '<div class="row" role="group" aria-label="Das Thema">'+THEMEN.map(t=>'<button class="chip" type="button" data-thema="'+t.id+'" aria-pressed="'+(t.id===thema)+'"'+(t.aktiv?'':' disabled title="Kommt später"')+'>'+esc(t.name)+(t.aktiv?'':' · bald')+'</button>').join('')+'</div>';
}
function frage(){
  const f=FRAGEN[i];beantwortet=false;stumm();leereKarte();
  $('#side').innerHTML=themenLeiste()+
  '<div class="meta"><span>Frage '+(i+1)+' von '+FRAGEN.length+'</span><span>Punkte: '+punkte+'</span></div>'+
  '<div class="progress"><i style="width:'+(i/FRAGEN.length*100)+'%"></i></div>'+
  '<p class="small" style="margin:0">Die Erfindung: <b>'+esc(f.ding)+'</b></p>'+
  '<h2 class="q">'+esc(f.frage)+'</h2>'+
  '<button class="vorlesen" type="button" data-lesen="frage" aria-pressed="false">🔊 Vorlesen</button>'+
  '<div class="opts">'+f.opts.map((o,k)=>'<button class="opt" type="button" data-k="'+k+'">'+esc(o)+'</button>').join('')+'</div>'+
  '<div id="info"></div>';
}
function antwort(k){
  if(beantwortet)return;beantwortet=true;stumm();const f=FRAGEN[i];
  if(k===f.r)punkte++;
  document.querySelectorAll('.opt').forEach((b,n)=>{b.disabled=true;if(n===f.r)b.classList.add('ok');else if(n===k)b.classList.add('bad');});
  $('.meta span:last-child').textContent='Punkte: '+punkte;
  const hauptort=f.orte[0];
  const osm='https://www.openstreetmap.org/?mlat='+hauptort[1]+'&mlon='+hauptort[2]+'#map=11/'+hauptort[1]+'/'+hauptort[2];
  $('#info').innerHTML='<div class="card"><h3>'+(k===f.r?'Richtig!':'Leider falsch.')+' '+esc(f.ding)+'</h3>'+
   '<dl class="facts"><dt>Wer?</dt><dd>'+esc(f.wer)+'</dd><dt>Wo?</dt><dd>'+esc(f.wo)+'</dd><dt>Wann?</dt><dd>'+esc(f.wann)+'</dd></dl>'+
   '<button class="vorlesen" type="button" data-lesen="info" aria-pressed="false">🔊 Vorlesen</button>'+
   '<p>'+esc(f.text)+'</p><p class="wort"><b>Das Wort:</b> '+esc(f.wort)+'</p>'+
   '<div class="links"><a href="https://de.wikipedia.org/wiki/'+encodeURIComponent(f.wiki)+'">Wikipedia lesen ↗</a><a href="'+osm+'">Auf der Karte öffnen ↗</a></div></div>'+
   '<button class="next" type="button" id="weiter">'+(i+1<FRAGEN.length?'Nächste Frage →':'Zum Ergebnis →')+'</button>';
  $('#maphint').style.display='none';
  zeigeOrte(f.orte);
  $('#weiter').focus({preventScroll:true});
}
function ende(){
  stumm();leereKarte();
  const proz=Math.round(punkte/FRAGEN.length*100);
  $('#side').innerHTML=themenLeiste()+'<div class="card end"><p class="small">Das Ergebnis</p><div class="big">'+punkte+' / '+FRAGEN.length+'</div><p><b>'+proz+' %</b> richtig</p><p>'+(proz>=80?'Ausgezeichnet!':proz>=50?'Gut gemacht!':'Beim nächsten Mal klappt es besser.')+'</p><button class="next" type="button" id="neu">Noch einmal spielen</button></div>'+
  '<p class="small">Weitere Themen (die Tiere, die Entdeckungen) kommen später dazu.</p>';
}
$('#side').addEventListener('click',e=>{
  const v=e.target.closest('.vorlesen');if(v){const f=FRAGEN[i];vorlesen(v,v.dataset.lesen==='frage'?frageText(f):infoText(f));return;}
  const o=e.target.closest('.opt');if(o){antwort(+o.dataset.k);return;}
  if(e.target.closest('#weiter')){i++;if(i<FRAGEN.length)frage();else ende();return;}
  if(e.target.closest('#neu')){i=0;punkte=0;frage();}
});
document.addEventListener('keydown',e=>{
  if(!beantwortet&&/^[1-4]$/.test(e.key)&&document.querySelector('.opt')){antwort(+e.key-1);}
  else if(beantwortet&&(e.key==='Enter'||e.key==='ArrowRight')&&document.getElementById('weiter')&&document.activeElement.id!=='weiter'){$('#weiter').click();}
});
if(typeof L==='undefined'){$('#maperr').style.display='flex';}else{karteStart();}
frage();
}
</script>
</body>
</html>
