<!--
  DE: Kopfleiste v2 (2026-11-04) – auf allen Seiten gleich.
      Zeile 1: ← Zurück · 🏠 Portal · Name · Uhr/KW/📅 · ⚙️
      Zeile 2: Menü (auf dem Handy seitlich wischen).
      Audio-System und Hell/Dunkel stecken jetzt im ⚙️-Fenster.
      Alte Kopfleiste: header_alt_2026-11.html (versteckt, nicht gelöscht).
  RU: Новая шапка: назад, домой, часы, календарь, ⚙️ (там Audio-System).
-->
<header class="site-header kopf2">
  <div class="kopf2__zeile1">
    <button type="button" class="kopf2__knopf" data-back title="Zurück / Назад">←<span class="kopf2__wort"> Zurück</span></button>
    <a class="kopf2__knopf" href="/index.html" data-nav="/index.html" title="Portal / Домой">🏠<span class="kopf2__wort"> Portal</span></a>

    <a class="kopf2__marke" href="/index.html" data-nav="/index.html">
      <span class="brand-badge">Q</span>
      <span class="kopf2__name">Quantura<span class="kopf2__spruch"> · Maß &amp; Klarheit</span></span>
    </a>

    <div class="site-header__actions kopf2__rechts">
      <div class="header-clock kopf2__uhr" title="Uhr · Kalender">
        <span id="headerDateTime"></span>
        <span id="headerKW" class="kopf2__kw"></span>
        <button id="headerCalendarBtn" class="kopf2__knopf kopf2__knopf--klein" type="button" aria-label="Kalender">📅</button>
      </div>
      <button type="button" class="kopf2__knopf" id="kopf2Einst" aria-expanded="false" aria-controls="kopf2Panel" title="Einstellungen / Настройки">⚙️</button>
    </div>
  </div>

  <nav class="kopf2__menue site-header__nav" aria-label="Hauptmenü">
    <a href="/index.html" class="nav-link" data-nav="/index.html">Portal</a>
    <a href="/pages/language_lab/index.html" class="nav-link">Language Lab</a>
    <a href="/pages/faecher/index.html" class="nav-link">Fächer</a>
    <a href="/pages/bibliothek/index.html" class="nav-link">Bibliothek</a>
    <a href="/pages/projekte/index.html" class="nav-link">Projekte</a>
    <a href="/demos/prog_min_portfolio/index.html" class="nav-link">Portfolio</a>
    <a href="/pages/store/index.html" class="nav-link">Store</a>
  </nav>

  <div class="kopf2__panel" id="kopf2Panel" hidden>
    <div class="kopf2__panel-titel">Einstellungen <small>· Настройки</small></div>

    <!-- 2026-11-04: Stimme für alle Seiten (Glossar, SprachBox, Spiele) / голос для всех страниц -->
    <div class="kopf2__feld">
      <label for="kopf2StimmeEn">🇬🇧 die Stimme Englisch <small>(голос английский)</small></label>
      <select id="kopf2StimmeEn" data-stimme="en"><option value="">Automatisch (empfohlen)</option></select>
    </div>
    <div class="kopf2__feld">
      <label for="kopf2StimmeDe">🇩🇪 die Stimme Deutsch <small>(голос немецкий)</small></label>
      <select id="kopf2StimmeDe" data-stimme="de"><option value="">Automatisch (empfohlen)</option></select>
      <small class="kopf2__hinweis">⚡ schnell · 🌐 online (langsam) – beim Wählen hörst du eine Probe.</small>
    </div>

    <details class="kopf2__erweitert">
      <summary>Erweitert <small>(дополнительно)</small></summary>
      <div class="audio-system kopf2__feld">
        <label for="ttsProfileSelect">🔊 das Audio-System <small>(Sprachausgabe / озвучка)</small></label>
        <select id="ttsProfileSelect">
          <option value="auto">Auto (empfohlen)</option>
          <option value="ios">iPhone / iPad (iOS)</option>
          <option value="android">Android (Samsung/Tablet/TV)</option>
          <option value="desktop">PC/Laptop (Windows/macOS/Linux)</option>
        </select>
        <span id="ttsProfileInfo" class="audio-info" tabindex="0" role="button" aria-label="Audio-System Info">ⓘ Was ist das?</span>
        <div id="ttsProfileNote" class="audio-note"></div>
      </div>
    </details>

    <div class="kopf2__feld">
      <span>Ansicht <small>(вид)</small></span>
      <button id="themeToggle" class="kopf2__knopf" type="button">
        <span class="theme-icon theme-icon--light">🌞 Hell</span>
        <span class="theme-icon theme-icon--dark">🌙 Dunkel</span>
      </button>
    </div>
  </div>
</header>
