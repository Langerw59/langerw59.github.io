<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Level 7 – Mal und geteilt mit Zehnern</title>
<script src="/core/js/core_init.js" defer></script>
<script src="/core/js/spiel_audio.js"></script>  <!-- Kopfleiste Quantura -->
  <link rel="stylesheet" href="../core/styles.css">
</head>
<body data-eigenes-bild data-farbwaechter="aus" data-kein-kopf>
  <div id="header-placeholder"></div>
  <main>
    <div id="welcome"></div>
    <section class="level-info-card">
      <h2>Level 7 – Mal und geteilt mit Zehnern</h2>
      <p>z. B. 30 · 4 und 240 : 6, Punkt vor Strich</p>
      <label class="time-mode-toggle">
        <input type="checkbox" id="timeModeToggle">
        Zeitmodus (5 Minuten gesamt)
      </label>
      <p class="time-mode-note">Bonus: +2 Punkte pro gesparter Minute.</p>
      <div id="timerBox" class="timer-box" hidden>
        <span class="hourglass" aria-hidden="true">⏳</span>
        <span id="timerText">05:00</span>
      </div>
    </section>

    <div id="tasks"></div>
    <p id="loadError" class="load-error" hidden>Aufgaben konnten nicht geladen werden.</p>
  </main>
  <div id="footer-placeholder"></div>
  <script src="../core/scripts.js" defer></script>
</body>
</html>
