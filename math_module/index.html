<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Mathematik Level-System</title>
<script src="/core/js/core_init.js" defer></script>  <!-- Kopfleiste Quantura -->
  <link rel="stylesheet" href="core/styles.css">
  <script src="core/scripts.js" defer></script>
</head>
<body data-eigenes-bild data-farbwaechter="aus" data-kein-kopf>
  <div id="header-placeholder"></div>
  <main>
    <div id="welcome"></div>
    <!-- 2026-11-26: kleine Startkarte in der Mitte – das Bild bleibt sichtbar; Level-Auswahl im Menü rechts -->
    <section id="levelDetail" class="mm-startkarte" aria-live="polite">
      <p class="mm-hallo" id="mm-hallo">Hallo! Los geht's mit:</p>
      <h3 id="levelDetailTitle">Level auswählen</h3>
      <p id="levelDetailDesc">Bitte ein Level wählen.</p>
      <button id="levelStartBtn" type="button" class="btn-primary">▶ Los geht's</button>
      <button id="mm-anderes-level" type="button" class="mm-link-knopf">☰ anderes Level wählen</button>
    </section>
    <div class="level-toolbar" aria-label="Level Auswahl" hidden>
      <select id="level-jump-select" aria-label="Level wählen"></select>
    </div>

    <details id="allLevelsDetails">
      <summary>Alle Level (für Lehrer)</summary>
      <div class="levels"></div>
    </details>
  </main>
  <div id="footer-placeholder"></div>
</body>
</html>
